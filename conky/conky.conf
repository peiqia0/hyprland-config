conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    double_buffer = true,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    font = 'JetBrainsMono Nerd Font:size=9',
    gap_x = 30,
    gap_y = 50,
    minimum_height = 200,
    minimum_width = 300,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    update_interval = 1,
    use_xft = true,
    default_color = '00ff46',
}

conky.text = [[
${color}DATE  ${time %Y-%m-%d}   TIME  ${time %H:%M:%S}
${hr}
CPU   ${cpu cpu0}%  ${cpubar cpu0 8,200}
TEMP  ${hwmon 0 temp 1}°C
${hr}
RAM   ${memperc}%  ${membar 8,200}
      ${mem} / ${memmax}
${hr}
DISK  ${fs_used_perc /}%  ${fs_bar 8,200 /}
      ${fs_used /} / ${fs_size /}
${hr}
NET  UP   ${upspeed}
     DOWN ${downspeed}
]]
